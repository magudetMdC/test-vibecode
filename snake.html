<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Rétro</title>
<style>
  :root {
    --bg: #0a0f0a;
    --panel: #0f1a0f;
    --grid: #162416;
    --snake: #39ff14;
    --snake-head: #7cff5c;
    --snake-tail: #1f7a0f;
    --food: #ff4d4d;
    --text: #c8ffc8;
    --accent: #39ff14;
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 12px;
  }
  h1 {
    margin: 0; font-size: 22px; letter-spacing: 4px;
    color: var(--accent); text-shadow: 0 0 8px var(--accent);
  }
  .hud {
    display: flex; gap: 24px; font-size: 16px; letter-spacing: 2px;
  }
  .hud span { color: var(--text); }
  .hud b { color: var(--accent); }
  .board-wrap {
    position: relative;
    border: 2px solid var(--accent);
    box-shadow: 0 0 18px rgba(57,255,20,0.35), inset 0 0 12px rgba(57,255,20,0.15);
    background: var(--panel);
  }
  canvas {
    display: block; image-rendering: pixelated;
    outline: none;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 16px;
    background: rgba(10,15,10,0.78);
    color: var(--text);
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0; font-size: 28px; letter-spacing: 4px;
    color: var(--accent); text-shadow: 0 0 10px var(--accent);
  }
  .overlay p { margin: 4px 0; font-size: 14px; letter-spacing: 1px; }
  .overlay .scoreline { font-size: 16px; }
  .overlay .scoreline b { color: var(--accent); }
  .btn {
    margin-top: 8px; padding: 8px 18px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); font-family: inherit; font-size: 14px;
    letter-spacing: 2px; cursor: pointer;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .toggle {
    padding: 6px 12px; font-size: 12px; letter-spacing: 1px;
    background: transparent; color: var(--text); border: 1px solid #2a4a2a;
    font-family: inherit; cursor: pointer;
  }
  .toggle:hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12px; opacity: 0.7; letter-spacing: 1px; }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .hud { font-size: 13px; gap: 14px; }
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <span>SCORE <b id="score">0</b></span>
    <span>BEST <b id="best">0</b></span>
    <span>VITESSE <b id="speed">8</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="board" tabindex="0" aria-label="Zone de jeu Snake" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">SNAKE</h2>
      <p id="overlayMsg">Appuie sur Entrée pour commencer</p>
      <p class="scoreline" id="overlayScore"></p>
      <button class="btn" id="startBtn">Jouer</button>
    </div>
  </div>
  <div class="controls">
    <span class="hint">Flèches : déplacer · Espace : pause · Entrée : démarrer/rejouer</span>
  </div>

<script>
(() => {
  'use strict';

  const GRID = 30;
  const START_SPEED = 8;     // cellules / seconde
  const MAX_SPEED = 18;
  const ACCEL_EVERY = 50;    // points par palier
  const ACCEL_AMOUNT = 1;    // cellules/s par palier
  const BEST_KEY = 'snake_best';

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const overlayScore = document.getElementById('overlayScore');
  const startBtn = document.getElementById('startBtn');
  let cell = 20;
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    const max = Math.min(620, window.innerWidth - 24, window.innerHeight - 220);
    const size = Math.max(180, max);
    cell = Math.floor(size / GRID);
    const px = cell * GRID;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- État du jeu ----------
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = { x: 0, y: 0 };
  let score = 0;
  let best = Number(localStorage.getItem(BEST_KEY)) || 0;
  let speed = START_SPEED;
  let status = 'idle'; // idle | running | paused | over
  let accumulator = 0;
  let lastTime = 0;
  let foodPulse = 0;

  bestEl.textContent = best;

  function reset() {
    const cx = Math.floor(GRID / 2);
    const cy = Math.floor(GRID / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = START_SPEED;
    accumulator = 0;
    placeFood();
    scoreEl.textContent = score;
    speedEl.textContent = speed;
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let x, y, key;
    do {
      x = Math.floor(Math.random() * GRID);
      y = Math.floor(Math.random() * GRID);
      key = x + ',' + y;
    } while (occupied.has(key));
    food = { x, y };
  }

  function setDir(nx, ny) {
    // empêche le demi-tour immédiat
    if (nx === -dir.x && ny === -dir.y) return;
    // évite d'écraser une entrée déjà en file
    if (nextDir.x !== dir.x || nextDir.y !== dir.y) {
      // déjà une entrée en attente : on l'ignore pour garder le comportement simple
    }
    nextDir = { x: nx, y: ny };
  }

  function tick() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // collision murs
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      gameOver(); return;
    }
    // collision soi
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // accélération
      const newSpeed = Math.min(MAX_SPEED, START_SPEED + Math.floor(score / ACCEL_EVERY) * ACCEL_AMOUNT);
      if (newSpeed !== speed) {
        speed = newSpeed;
        speedEl.textContent = speed;
      }
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem(BEST_KEY, String(best));
      }
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    status = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
    showOverlay('GAME OVER', 'Appuie sur Entrée pour rejouer', true);
  }

  function showOverlay(title, msg, showScore) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    if (showScore) {
      overlayScore.innerHTML = 'Score : <b>' + score + '</b>  ·  Meilleur : <b>' + best + '</b>';
    } else {
      overlayScore.textContent = '';
    }
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function start() {
    reset();
    status = 'running';
    hideOverlay();
    lastTime = performance.now();
    accumulator = 0;
  }

  function pauseToggle() {
    if (status === 'running') {
      status = 'paused';
      showOverlay('PAUSE', 'Appuie sur Espace pour reprendre', false);
    } else if (status === 'paused') {
      status = 'running';
      hideOverlay();
      lastTime = performance.now();
      accumulator = 0;
    }
  }

  // ---------- Rendu ----------
  function draw() {
    const px = cell * GRID;
    ctx.clearRect(0, 0, px, px);

    // fond
    ctx.fillStyle = '#0a0f0a';
    ctx.fillRect(0, 0, px, px);

    // grille
    ctx.strokeStyle = '#162416';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= GRID; i++) {
      const v = i * cell + 0.5;
      ctx.moveTo(v, 0); ctx.lineTo(v, px);
      ctx.moveTo(0, v); ctx.lineTo(px, v);
    }
    ctx.stroke();

    // nourriture (pulsation)
    foodPulse += 0.08;
    const pulse = 0.85 + 0.15 * Math.sin(foodPulse);
    const fr = (cell / 2) * pulse;
    const fx = food.x * cell + cell / 2;
    const fy = food.y * cell + cell / 2;
    ctx.fillStyle = '#ff4d4d';
    ctx.shadowColor = '#ff4d4d';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // serpent
    snake.forEach((seg, i) => {
      const t = i / Math.max(1, snake.length - 1);
      // dégradé tête -> queue
      const r = Math.round(57 + (31 - 57) * t);
      const g = Math.round(255 + (122 - 255) * t);
      const b = Math.round(20 + (15 - 20) * t);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      if (i === 0) {
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 12;
      }
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2);
      ctx.shadowBlur = 0;
    });

    // yeux sur la tête
    if (snake.length) {
      const h = snake[0];
      ctx.fillStyle = '#0a0f0a';
      const ex = h.x * cell, ey = h.y * cell;
      let e1, e2;
      if (dir.x === 1) { e1 = [ex + cell - 6, ey + 5]; e2 = [ex + cell - 6, ey + cell - 7]; }
      else if (dir.x === -1) { e1 = [ex + 4, ey + 5]; e2 = [ex + 4, ey + cell - 7]; }
      else if (dir.y === -1) { e1 = [ex + 5, ey + 4]; e2 = [ex + cell - 7, ey + 4]; }
      else { e1 = [ex + 5, ey + cell - 6]; e2 = [ex + cell - 7, ey + cell - 6]; }
      ctx.fillRect(e1[0], e1[1], 3, 3);
      ctx.fillRect(e2[0], e2[1], 3, 3);
    }
  }

  // ---------- Boucle ----------
  function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (status === 'running') {
      accumulator += dt;
      const step = 1 / speed;
      let steps = 0;
      while (accumulator >= step && steps < 4) {
        accumulator -= step;
        tick();
        steps++;
        if (status !== 'running') break;
      }
      if (accumulator > step) accumulator = step; // évite l'accumulation
    }

    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(loop); });

  // ---------- Entrées ----------
  function handleKey(e) {
    const k = e.key;
    if (k === 'ArrowUp') { e.preventDefault(); setDir(0, -1); }
    else if (k === 'ArrowDown') { e.preventDefault(); setDir(0, 1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); setDir(-1, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); setDir(1, 0); }
    else if (k === ' ' || k === 'p' || k === 'P') { e.preventDefault(); if (status === 'running' || status === 'paused') pauseToggle(); }
    else if (k === 'Enter') {
      e.preventDefault();
      if (status === 'idle' || status === 'over') start();
      else if (status === 'paused') pauseToggle();
    }
    else if (k === 'Escape') { e.preventDefault(); if (status === 'running' || status === 'paused') pauseToggle(); }
  }
  window.addEventListener('keydown', handleKey);
  canvas.addEventListener('focus', () => {});
  canvas.focus();

  startBtn.addEventListener('click', () => { start(); });

  // état initial
  reset();
  status = 'idle';
  showOverlay('SNAKE', 'Appuie sur Entrée pour commencer', false);
})();
</script>
</body>
</html>
